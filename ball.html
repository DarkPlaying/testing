<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        background: linear-gradient(45deg, rgb(255, 204, 204), rgb(253, 131, 131));
        width: 100%;
        height: 98vh;;
        border: 1px solid black;
        border-radius: 15px;
        align-items: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
    
    }
    .box{
        width: 800px;
        height: 500px;
        border: 1px solid black;
        border-radius: 15px;
        background: rgb(247, 238, 238);
        position: relative;
    }
    .ball1{
        width: 50px;
        height: 50px;
        border: 1px solid black;
        border-radius: 50px;
        animation:swingup 5s infinite alternate ease-in-out;
        background: linear-gradient(45deg, rgb(255, 204, 204), rgb(253, 131, 131));
    }
    .ball2{
        width: 50px;
        height: 50px;
        border: 1px solid black;
        border-radius: 50px;
        position: absolute;
        top: 0;
        right: 0;
        animation:swingdown 5s infinite alternate ease-in-out;
        background: linear-gradient(45deg, rgb(255, 204, 204), rgb(253, 131, 131));
    }
    @keyframes swingdown{
        0%{
            transform:translate(0px,0px),rotate(0deg);
        }
        30%{
            transform:translate(-100px,450px);
            background: linear-gradient(45deg, rgb(255, 247, 0), rgb(253, 131, 131));

        }
        40%{
            transform:translate(-300px,0px);
            background: linear-gradient(45deg, rgb(255, 0, 0), rgb(253, 131, 131));

        }
        60%{
            transform:translate(-600px,450px);
             background: linear-gradient(45deg, rgb(0, 0, 255), rgb(250, 248, 248));

        }
        100%{
            transform:translate(-750px,0);
            background: linear-gradient(45deg, rgb(94, 255, 0), rgb(241, 238, 238));

        }

    }
    @keyframes swingup{
        0%{
            transform:translate(0px,0px);
            
        }
        30%{
            transform:translate(100px,450px);
            background: linear-gradient(45deg, rgb(255, 247, 0), rgb(253, 131, 131));
        }
        40%{
            transform:translate(300px,0px);
            background: linear-gradient(45deg, rgb(255, 0, 0), rgb(253, 131, 131));
        }
        60%{
            transform:translate(600px,450px);
            background: linear-gradient(45deg, rgb(0, 0, 255), rgb(250, 248, 248));
        }
        100%{
            transform:translate(750px,0);
            background: linear-gradient(45deg, rgb(94, 255, 0), rgb(241, 238, 238));
        }
    
    }
    .text{
        text-align: center;
        font-size: 50px;
    }
</style>
<body>
    <div class="container">
        <h1 class="text">Ball Bounce Animation</h1>
        <div class="box">
        <div class="ball1"></div>
        <div class="ball2"></div></div>
    </div>
</body>
</html>
