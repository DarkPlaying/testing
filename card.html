<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6fb;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            width: 90%;
            max-width: 960px;
            padding: 40px 50px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0px 0px 30px 30px rgba(0, 0, 0, 0.05);
        }


        .card {
            width: 350px;
            height: 215px;
            border-radius: 18px;
            background-color: #172554;
            position: relative;
            padding: 22px 26px;
            color: white;
            box-shadow: 0px 12px 28px rgba(13, 27, 62, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            flex-shrink: 0;
        }


        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .card-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.4);
        }

        .card-brand {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .card-number-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .card-number {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .contactless-icon {
            display: flex;
            align-items: center;
            opacity: 0.9;
        }

        .card-dates-row {
            display: flex;
            gap: 40px;
            margin-left: 50px;
            position: relative;
            z-index: 1;
        }

        .date-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-label {
            font-size: 7px;
            font-weight: 700;
            line-height: 1.1;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .date-value {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }

        .card-holder {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .rupay-tag {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .rupay-tag span {
            color: #f97316;
        }

        .cardinfo {
            display: flex;
            flex-direction: column;
            gap: 22px;
            flex-grow: 1;
        }

        .heading {
            font-size: 22px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 4px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 160px 25px 1fr;
            row-gap: 18px;
            align-items: center;
        }

        .info-label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        .info-colon {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        .info-value {
            font-size: 15px;
            font-weight: 700;
            color: #b5179e;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-top">
                <div class="card-logo-icon">
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </div>
                <span class="card-brand">IDFC</span>
            </div>

            <div class="card-number-row">
                <span class="card-number">ID0301100023</span>
                <div class="contactless-icon">
                    <i class="fa-solid fa-wifi" aria-hidden="true"></i>
                </div>
            </div>

            <div class="card-dates-row">
                <div class="date-box">
                    <span class="date-label">VALID<br>FROM</span>
                    <span class="date-value">06/25</span>
                </div>
                <div class="date-box">
                    <span class="date-label">VALID<br>UPTO</span>
                    <span class="date-value">03/26</span>
                </div>
            </div>

            <div class="card-bottom">
                <span class="card-holder">Sanjay M</span>
                <span class="rupay-tag">RuPay <i class="fa-solid fa-caret-right" aria-hidden="true"></i></span>
            </div>
        </div>

        <div class="cardinfo">
            <h1 class="heading">My Bank Details</h1>
            <div class="info-grid">
                <span class="info-label">User Name</span>
                <span class="info-colon">:</span>
                <span class="info-value">Sanjay M</span>

                <span class="info-label">Bank Name</span>
                <span class="info-colon">:</span>
                <span class="info-value">IDFC</span>

                <span class="info-label">Account Number</span>
                <span class="info-colon">:</span>
                <span class="info-value">ID0301100023</span>

                <span class="info-label">Minimum Balance</span>
                <span class="info-colon">:</span>
                <span class="info-value">$ 500</span>

                <span class="info-label">MMB Fee</span>
                <span class="info-colon">:</span>
                <span class="info-value">$ 1,000</span>
            </div>
        </div>
    </div>
</body>

</html>
