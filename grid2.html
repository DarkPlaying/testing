<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        border: solid 1px black;
        height: 96vh;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 15px;
        border-radius: 15px;
        background: linear-gradient(45deg, orange, pink);
    }

    .box {
        border: 1px solid black;
        padding: 10px;
        border-radius: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        background: radial-gradient(circle, rgb(228, 235, 182), orange);
    }

    .box2 {
        grid-column: span 2;
    }
</style>

<body>
    <div class="container">
        <div class="box box1">Button</div>
        <div class="box box2">Card</div>
        <div class="box box3">Account</div>
        <div class="box box4">Calender</div>
        <div class="box box5">Intregration</div>
    </div>
</body>

</html>
