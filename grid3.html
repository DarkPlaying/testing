<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        border: 1px solid black;
        height: 96vh;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
        background-color: rgb(255, 207, 144);

    }

    .box {
        border: 1px solid black;
        padding: 10px;
        gap: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: linear-gradient(35deg, red, rgb(235, 156, 169));
    }

    .box1 {
        grid-column: span 3;
        height: 20px;

    }

    .box2 {
        grid-row: span 2;
        height: 600px;
    }

    .box3 {
        grid-column: span 2;
    }

    .box6 {
        grid-column: span 3;
        height: 20px;
    }
</style>

<body>
    <div class="container">
        <div class="box box1">Header</div>
        <div class="box box2">Sider</div>
        <div class="box box3">Content 1</div>
        <div class="box box4">content 2</div>
        <div class="box box5">Content 3</div>
        <div class="box box6">footer</div>
    </div>
</body>

</html>
