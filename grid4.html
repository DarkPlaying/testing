<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        height: 98vh;
        border: 1px solid black;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 5px;
        border-radius: 15px;
        padding: 3px;
    }

    .box {
        border: 1px solid black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: linear-gradient(35deg, purple, black);
        border-radius: 15px;
        color: white;
    }

    #box1 {
        grid-column: span 3;
        height: 50px;
    }

    #box2 {
        grid-column: span 3;
        height: 200px;
    }

    #box3 {
        height: 200px;
    }

    #box5 {
        height: 200px;
    }

    #box4 {
        grid-column: span 2;
    }

    #box8 {
        grid-column: span 3;
        height: 50px;
    }
</style>

<body>
    <div class="container">
        <div class="box" id="box1">Navigation</div>
        <div class="box" id="box2">Header</div>
        <div class="box" id="box3">Sider</div>
        <div class="box" id="box4">Main Content</div>
        <div class="box" id="box5">aside 1</div>
        <div class="box" id="box6">aside 2</div>
        <div class="box" id="box7">aside 3</div>
        <div class="box" id="box8">footer</div>
    </div>
</body>

</html>
