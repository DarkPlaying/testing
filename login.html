<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #e8f0fe;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px #bbb;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[type="submit"] {
            margin-top: 20px;
            background-color: #2874a6;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #1b4f72;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
        }

        .forgot a {
            color: #2874a6;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <input type="submit" value="Login">

        </form>

    </div>

</body>
</html>
