<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: black;
        font-family: 'Times New Roman', Times, serif;
    }

    .container {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(255, 255, 255, 0.35);
    }

    .box {
        width: min(90vw, 900px);
        min-height: 520px;
        display: flex;
        border-radius: 26px;
        position: relative;
        background-color: #ffffff;
        box-shadow: 0 20px 50px rgba(102, 84, 180, 0.18);
        overflow: hidden;
        border: 1px solid rgba(120, 120, 160, 0.12);
        transition: box-shadow 0.45s ease, border-color 0.45s ease, background-color 0.45s ease;
    }

    .box:hover {
        box-shadow: 0 40px 110px rgba(102, 84, 180, 0.42);
        border-color: rgba(110, 90, 220, 0.25);
        background-color: #fdfdff;
    }

    .img {
        width: 48%;
        min-height: 520px;
        border-radius: 26px 0 0 26px;
        overflow: hidden;
        object-fit: cover;
        display: block;
        margin: 0;
        padding: 0;
    }

    .login {
        width: 52%;
        min-height: 520px;
        border-radius: 0 26px 26px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 35px 40px 25px;
        background: linear-gradient(180deg, #ffffff 0%, #f8f8ff 100%);
    }

    form {
        width: 100%;
    }

    .details1 {
        font-size: 15px;
        font-weight: 800;
        padding: 10px 0 12px;
        color: #4b2bb8;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Georgia', 'Times New Roman', serif;
        transition: font-style 0.45s ease, color 0.45s ease, font-size 0.45s ease, letter-spacing 0.45s ease;
    }

    .details2 {
        font-size: 30px;
        padding-bottom: 8px;
        font-weight: 800;
        color: #1b1b2f;
        text-align: center;
        font-family: 'Georgia', 'Times New Roman', serif;
        transition: font-style 0.45s ease, color 0.45s ease, font-size 0.45s ease, letter-spacing 0.45s ease;
    }

    .details3 {
        font-size: 12px;
        padding-bottom: 20px;
        opacity: 0.7;
        text-align: center;
        color: #4f4f5d;
        line-height: 1.5;
        font-family: 'Georgia', 'Times New Roman', serif;
        transition: font-style 0.45s ease, color 0.45s ease, font-size 0.45s ease, letter-spacing 0.45s ease;
    }

    .box:hover .details1,
    .box:hover .details2,
    .box:hover .details3 {
        color: #3d1ea8;
        font-size: 1.08em;
        font-style: italic;
        letter-spacing: 0.4px;
    }

    form label {
        opacity: 0.7;
        color: #2c2c39;
        font-size: 13px;
        font-weight: 600;
    }

    form input {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(72, 72, 92, 0.18);
        height: 42px;
        margin-top: 10px;
        padding: 0 14px;
        margin-bottom: 14px;
        background: #f9f9ff;
        outline: none;
        font-family: 'Times New Roman', Times, serif;
        font-size: 15px;
        color: #1f1f2d;
        transition: border-color 0.35s ease, box-shadow 0.35s ease, background-color 0.35s ease, color 0.35s ease, padding 0.35s ease;
    }

    form input:hover {
        background-color: #ffffff;
        border-color: rgba(104, 84, 216, 0.4);
        box-shadow: 0 8px 18px rgba(93, 61, 242, 0.08);
        padding-top: 2px;
        padding-bottom: 2px;
    }

    form input:focus {
        border-color: #7c5cff;
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.12);
        background: #fff;
        color: #2e1b78;
    }

    .chkbtn {
        border-radius: 20px;
        border: 0.5px solid black;
        height: 25px;
    }

    .rem {
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0 18px;
        color: #3d3d4f;
    }

    .rem input {
        width: 14px;
        height: 14px;
        margin: 0;
    }

    .rem a {
        color: #5d3df2;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s ease, color 0.2s ease;
    }

    .rem a:hover {
        opacity: 0.8;
        color: #3b1ca8;
    }

    button {
        width: 100%;
        height: 44px;
        margin-top: 10px;
        border-radius: 14px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 16px;
        letter-spacing: 0.3px;
        color: #ffffff;
        transition: box-shadow 0.35s ease, background-color 0.35s ease, opacity 0.35s ease, color 0.35s ease, border-color 0.35s ease, font-size 0.35s ease, font-weight 0.35s ease, letter-spacing 0.35s ease, text-shadow 0.35s ease, font-style 0.35s ease;
    }

    button:hover {
        box-shadow: 0 16px 30px rgba(82, 0, 196, 0.26);
        border-color: rgba(102, 84, 180, 0.2);
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #f3ebff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
        font-style: italic;
    }

    .hl {
        border-bottom: 1px solid rgba(48, 48, 60, 0.18);
        width: 120px;
        position: absolute;
        top: 352px;
        left: 55%;
        opacity: 0.9;
    }

    .hl2 {
        border-bottom: 1px solid rgba(48, 48, 60, 0.18);
        width: 120px;
        position: absolute;
        top: 352px;
        left: 55%;
        opacity: 0.9;
    }

    input::placeholder {
        color: rgba(48, 48, 60, 0.55);
        font-weight: 500;
    }

    .sign-in {
        background-color: #f2f2f7;
        color: #29293a;
        font-weight: 700;
        margin-top: 12px;
        transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, height 0.35s ease, font-size 0.35s ease, font-weight 0.35s ease;
    }

    .sign-in:hover {
        background: linear-gradient(135deg, #e9e5ff, #d8d2ff);
        color: #3c1aa0;
        box-shadow: 0 16px 28px rgba(93, 61, 242, 0.18);
        border-color: rgba(93, 61, 242, 0.18);
        height: 48px;
        font-size: 17px;
        font-weight: 800;
    }

    .end {
        text-align: center;
        font-size: 15px;
        margin-top: 18px;
        color: #4d4d5f;
    }

    .end a {
        text-decoration: none;
        font-weight: 700;
        color: #5220c8;
        transition: color 0.2s ease, opacity 0.2s ease;
    }

    .end a:hover {
        color: #3d1ea8;
        opacity: 0.85;
        text-shadow: 0 0 8px rgba(93, 61, 242, 0.18);
    }
</style>
